[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
; Godot 4.4+ édite lui-même les ressources PE : ni rcedit ni wine ne sont requis.
application/modify_resources=true
application/icon="res://assets/icons/icon.png"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="2.2.0.0"
application/product_version="2.2.0.0"
application/company_name="A. Laine"
application/product_name="AMeal Planner"
application/file_description="Planificateur de repas et liste de courses"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

[preset.2]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Mêmes exclusions que les autres plateformes : tools/ contient l'export des données personnelles.
exclude_filter="tools/*, supabase/*, *.md"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

custom_template/debug=""
custom_template/release=""
; godot-sqlite est une GDExtension : sans ce gabarit, la base ne se charge pas.
variant/extensions_support=true
; Sans fils d'exécution : l'hébergement n'a pas à poser les en-têtes COOP/COEP, qu'un
; hébergeur statique gratuit ne permet pas toujours. godot-sqlite fournit le binaire
; correspondant depuis la v4.9 (cf. gdsqlite.gdextension).
variant/thread_support=false
; Version ordinateur uniquement.
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
