[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
; all_resources + exclude_filter : on embarque tout le projet SAUF les motifs listés.
; ("exclude" est un autre mode, qui s'appuie sur une liste explicite de fichiers.)
export_filter="all_resources"
include_filter=""
; tools/ contient recettes_export_personnel.json — l'export des données privées de
; l'ancienne base, artefact de migration qui n'a rien à faire dans un APK distribué.
; Les scripts de test et de capture n'y ont pas leur place non plus.
exclude_filter="tools/*, supabase/*, *.md"
export_path="build/AMealPlanner.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_dir=""
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
; Renseignés par tools/release.sh depuis application/config/version.
; version/code doit croître strictement à chaque publication : Android refuse
; d'installer par-dessus une version dont le code est inférieur ou égal.
version/code=20200
version/name="2.2.0"
package/unique_name="com.alaine.amealplanner"
package/name="AMeal Planner"
package/signed=true
; Chemin et identifiants du keystore de release : volontairement VIDES ici, ce
; fichier étant versionné. Ils sont fournis à l'export par les variables
; d'environnement GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD.
keystore/release=""
keystore/release_user=""
keystore/release_password=""
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://assets/icons/android_launcher.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icons/android_foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/icons/android_background.png"
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
; Mode immersif désactivé : l'app masquait la barre d'état et la barre de navigation.
; Ce n'est pas un jeu — on veut voir l'heure et la batterie en faisant ses courses, et
; garder le geste de retour du système accessible.
screen/immersive_mode=false
; L'app est pensée en portrait : liste de courses et calendrier vertical.
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
; arm64 seul : tous les téléphones Android récents le sont, et godot-sqlite fournit
; bien un binaire arm64. x86_64 ne servirait qu'à un émulateur.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; Trois permissions, et trois seulement. INTERNET : synchronisation Supabase. CAMERA :
; photographier un plat depuis la fiche recette — demandée à l'ouverture de l'écran de
; prise de vue, pas au lancement. VIBRATE : le léger retour tactile quand on coche un
; article (`Haptics`) — permission « normale », accordée à l'installation sans rien
; demander à l'utilisateur. Rien pour le stockage : la base SQLite vit dans
; user://, dans l'espace privé de l'app, et le choix d'un fichier passe par le
; sélecteur du système, qui donne accès à l'image sans permission.
permissions/camera=true
permissions/internet=true
permissions/vibrate=true

